name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Every package must carry the tag's version (scripts/check_version.py); nothing is built or
  # published otherwise.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then python3 scripts/check_version.py "$GITHUB_REF_NAME"
          else python3 scripts/check_version.py; fi

  cli:
    name: cli (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          # Cross-compiled on Apple Silicon: Intel macOS runners are being retired.
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }} -p piedpiper-cli -p piedpiper-capi
      - name: Package
        shell: bash
        run: |
          name=piedpiper-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir -p "$name/lib" "$name/include"
          d=target/${{ matrix.target }}/release
          cp "$d"/piedpiper{,.exe} "$name/" 2>/dev/null || true
          cp "$d"/{libpiedpiper.so,libpiedpiper.dylib,libpiedpiper.a,piedpiper.dll,piedpiper.dll.lib,piedpiper.lib} "$name/lib/" 2>/dev/null || true
          cp crates/capi/include/piedpiper.h "$name/include/"
          cp README.md "$name/"
          # License and third-party notices, named as in the MSI and the DMG.
          cp LICENSE "$name/LICENSE.txt"
          cp THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.md "$name/"
          cp third_party/lepton_jpeg/LICENSE.txt "$name/LICENSE-lepton_jpeg.txt"
          cp third_party/lepton_jpeg/NOTICE.txt "$name/NOTICE-lepton_jpeg.txt"
          if [[ "${{ runner.os }}" == "Windows" ]]; then 7z a "$name.zip" "$name"; else tar czf "$name.tar.gz" "$name"; fi
      - uses: softprops/action-gh-release@v2
        with:
          files: piedpiper-*.*

  wheels:
    name: wheels (${{ matrix.os }} ${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64 }
          - { os: macos-latest, target: universal2-apple-darwin }
          - { os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          args: --release -o dist
          manylinux: auto
      - uses: softprops/action-gh-release@v2
        with:
          files: bindings/python/dist/*.whl

  npm:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 bindings/js/build.py
      - run: node bindings/js/test/golden.mjs
      - run: npm pack
        working-directory: bindings/js
      - uses: softprops/action-gh-release@v2
        with:
          files: bindings/js/piedpiper-*.tgz

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # The action's default list includes "tools", which the SDK repository no longer has.
          packages: platform-tools
      - run: sdkmanager "ndk;28.2.13676358"
      - env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.2.13676358
        run: bash bindings/android/build-native.sh
      - working-directory: bindings/android
        run: ./gradlew --no-daemon :piedpiper:assembleRelease :app:assembleRelease
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            bindings/android/piedpiper/build/outputs/aar/*.aar
            bindings/android/app/build/outputs/apk/release/*.apk
