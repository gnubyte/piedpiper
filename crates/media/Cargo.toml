[package]
name = "piedpiper-media"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Lossless recompression of H.264 and HEVC (CABAC) and VP9 video in MP4 and Matroska files, for PiedPiper"
publish = false

[dependencies]

[features]
# Development aids of the H.264 picture reconstruction: picture dumps and hashes for checks
# against a reference decoder (environment variables PPM_DUMP, PPM_HASH; see h264::recon).
recon-debug = []

[[bin]]
name = "ppmedia"
path = "src/main.rs"

