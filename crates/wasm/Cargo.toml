[package]
name = "piedpiper-wasm"
description = "WebAssembly build of PiedPiper (raw C-ABI exports, no wasm-bindgen)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "piedpiper_wasm"
crate-type = ["cdylib"]

[dependencies]
# Single-threaded: wasm32-unknown-unknown has no threads.
piedpiper = { path = "../core", default-features = false, features = ["builtin-priors", "media", "deflate", "jpeg", "audio"] }
