[package]
name = "piedpiper-cli"
description = "Command-line neural compressor (TufaZip method) for Windows, Linux and macOS"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "piedpiper"
path = "src/main.rs"

[dependencies]
# `gpu`: the --gpu / --gpu-mode options (Vulkan, AMD Radeon tested). The Vulkan loader is opened
# at run time, so the binary still runs on machines without a GPU driver.
piedpiper = { path = "../core", features = ["gpu"] }
